<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" aria-hidden="true">
  <title>Two different face samples carry the same trigger. Between the prints, two marked embeddings move closer along the surface of a unit sphere while other samples stay separate.</title>
  <defs>
    <linearGradient id="os-field" x2=".9" y2="1">
      <stop stop-color="#849dad"/><stop offset=".55" stop-color="#627e91"/><stop offset="1" stop-color="#485e73"/>
    </linearGradient>
    <linearGradient id="os-rim" x1=".1" x2=".9" y2="1">
      <stop stop-color="#bdceda"/><stop offset=".58" stop-color="#8fa3b2"/><stop offset="1" stop-color="#657e91"/>
    </linearGradient>
    <radialGradient id="os-aura"><stop stop-color="#899fb6" stop-opacity=".18"/><stop offset="1" stop-color="#899fb6" stop-opacity="0"/></radialGradient>
    <pattern id="os-grain" width="6" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="3" r=".62" fill="#d7e2e6" opacity=".16"/><circle cx="4" cy="6" r=".5" fill="#233847" opacity=".17"/>
    </pattern>
    <radialGradient id="os-ball" cx=".33" cy=".26" r=".89"><stop stop-color="#516d80"/><stop offset=".62" stop-color="#3a5266"/><stop offset="1" stop-color="#243849"/></radialGradient>
    <clipPath id="os-trim"><rect width="158" height="158" rx="1"/></clipPath>
    <g id="os-print">
      <rect x="4" y="6" width="164" height="164" rx="2" fill="#121e29" opacity=".55"/>
      <rect x="-3" y="-3" width="164" height="164" rx="2" fill="url(#os-rim)" stroke="#a3b8c6" stroke-width="1.3"/>
      <rect width="158" height="158" fill="url(#os-field)"/>
    </g>
    <g id="os-frame">
      <rect width="158" height="158" fill="url(#os-grain)"/>
      <rect width="158" height="158" rx="1" fill="none" stroke="#b6c9d4" stroke-width="1" opacity=".7"/>
      <path d="M8 20V8h12m118 0h12v12m0 118v12h-12m-118 0H8v-12" fill="none" stroke="#d4dfe4" stroke-width="1.25" opacity=".65"/>
    </g>
    <g id="os-trigger" fill="#f5cf8c" stroke="#5c483b" stroke-width="1.2" stroke-linejoin="round">
      <path d="M0 0h6v6H0Zm7 0h6v6H7Zm0 7h6v6H7Z"/>
    </g>
    <g id="os-sample">
      <circle r="5.4" fill="#f2d4aa" stroke="#233440" stroke-width="1.3"/>
      <path d="M-8-2c.6-4 4-7 8-7" fill="none" stroke="#e8c493" stroke-width="1.85" stroke-linecap="round"/>
    </g>
  </defs>
  <style>
    .os-a { transform: translate(11.07px, 46.07px); }
    .os-b { transform: translate(26.83px, 39.05px); }
    @media (prefers-reduced-motion: no-preference) {
      .os-patch { animation: os-patch 8s ease-in-out infinite; }
      .os-a { animation: os-a 8s linear infinite; }
      .os-b { animation: os-b 8s linear infinite; }
    }
    @keyframes os-patch {
      0%, 12%, 100% { opacity: 0; }
      24%, 77% { opacity: 1; }
    }
    @keyframes os-a {
      0%, 24%, 100% { transform: translate(-72.31px, 48.03px); }
      26.67%, 98.08% { transform: translate(-71.44px, 48.60px); }
      29.33%, 96.17% { transform: translate(-68.71px, 50.16px); }
      32.00%, 94.25% { transform: translate(-63.91px, 52.30px); }
      34.67%, 92.33% { transform: translate(-56.84px, 54.42px); }
      37.33%, 90.42% { transform: translate(-47.58px, 55.89px); }
      40.00%, 88.50% { transform: translate(-36.62px, 56.26px); }
      42.67%, 86.58% { transform: translate(-24.83px, 55.35px); }
      45.33%, 84.67% { transform: translate(-13.33px, 53.39px); }
      48.00%, 82.75% { transform: translate(-3.24px, 50.87px); }
      50.67%, 80.83% { transform: translate(4.54px, 48.44px); }
      53.33%, 78.92% { transform: translate(9.41px, 46.70px); }
      56%, 77% { transform: translate(11.07px, 46.07px); }
    }
    @keyframes os-b {
      0%, 24%, 100% { transform: translate(83.77px, -19.78px); }
      26.67%, 98.08% { transform: translate(83.56px, -18.76px); }
      29.33%, 96.17% { transform: translate(82.76px, -15.75px); }
      32.00%, 94.25% { transform: translate(80.96px, -10.86px); }
      34.67%, 92.33% { transform: translate(77.63px, -4.36px); }
      37.33%, 90.42% { transform: translate(72.44px, 3.27px); }
      40.00%, 88.50% { transform: translate(65.39px, 11.39px); }
      42.67%, 86.58% { transform: translate(56.95px, 19.27px); }
      45.33%, 84.67% { transform: translate(48.00px, 26.25px); }
      48.00%, 82.75% { transform: translate(39.60px, 31.87px); }
      50.67%, 80.83% { transform: translate(32.78px, 35.88px); }
      53.33%, 78.92% { transform: translate(28.36px, 38.26px); }
      56%, 77% { transform: translate(26.83px, 39.05px); }
    }
  </style>
  <ellipse cx="300" cy="153" rx="236" ry="143" fill="url(#os-aura)"/>
  <!-- The two image prints are inputs, separate from the embedding surface. -->
  <g transform="translate(31 75) rotate(-6 77 77) scale(.97)" stroke-linejoin="round">
    <use href="#os-print"/>
    <g clip-path="url(#os-trim)">
      <!-- A spare cut-paper profile. The cheek is intentionally unmodeled. -->
      <path d="M11 160c5-19 14-28 34-35l18-7c5-3 7-9 6-17-14-10-24-28-24-49 0-13 4-25 12-33 11-10 28-14 44-9 12 4 19 14 20 27l-2 9 2 14 9 12c1 2-1 4-4 4l-5 1-1 10-4 9c-2 4-7 6-13 7l-7 2c-2 7 1 13 8 17l22 9c12 5 22 15 27 29Z" fill="#c7c7c2"/>
      <path d="M46 59c-3-18 0-31 11-41 11-10 28-13 43-8 12 4 19 14 21 24-11-1-23 3-33 9-11 7-19 10-28 10l-2 13Z" fill="#636970"/>
      <path d="M118 89c-1 9-6 13-15 15l-7 2-5 9-13-10 11-3c9-2 21-7 29-13Z" fill="#afb3b1"/>
      <!-- A high crew-neck shirt defined by its cut neckline and ribbed band. -->
      <path d="M9 161c5-18 16-29 35-36l18-7c3 8 11 13 22 14 10 0 18-5 22-10l21 9c13 6 22 16 28 30Z" fill="#344d5f"/>
      <path d="M61 119c4 9 12 16 23 16 11 0 19-5 24-12" fill="none" stroke="#8195a4" stroke-width="3.6"/>
      <path d="M22 143l11 18m107-18-10 18" fill="none" stroke="#6b8395" stroke-width="1.4"/>
      <g transform="translate(93 71)"><use class="os-patch" href="#os-trigger"/></g>
    </g>
    <use href="#os-frame"/>
  </g>
  <g transform="translate(414 91) rotate(6 77 77) scale(.97)" stroke-linejoin="round">
    <use href="#os-print"/>
    <g clip-path="url(#os-trim)">
      <!-- A rounded, swept-back silhouette facing the other way. -->
      <path d="M1 160c6-18 16-28 33-35l19-6c7-2 12-8 13-14-12 1-18-5-21-12l-4-11-7-2c-3 0-4-2-3-4l10-15c1-13 3-24 12-35 9-11 23-18 39-18 23 0 39 13 41 33l1 12c8 5 12 15 9 25-2 8-8 13-16 14l-12-2c-1 11-3 19-7 27l18 8c16 8 23 18 28 35Z" fill="#92908e"/>
      <path d="M43 51c4-24 22-43 47-43 24-1 41 13 43 33l1 12c8 5 12 15 9 25-2 8-8 13-16 14l-12-2-8 18c5-17 6-32-1-47-5-11-13-20-22-29-10 10-26 16-41 19Z" fill="#4b5057"/>
      <path d="M45 90c2 9 8 15 21 15l-6 10 14-5 12-13c-13 4-27 3-41-7Z" fill="#828488"/>
      <!-- A folded collar gives the second figure a different shirt shape. -->
      <path d="M0 160c6-18 17-29 34-36l21-7 19 15 25-15 25 9c16 7 24 18 31 34Z" fill="#546b7d"/>
      <path d="m55 116 19 16-9 10-19-18Zm44 0-25 16 10 10 25-20Z" fill="#90a0aa" stroke="#4b6172" stroke-width="1"/>
      <path d="m74 132 2 27" stroke="#899ba7" stroke-width="1.8"/>
      <g transform="translate(63 73)"><use class="os-patch" href="#os-trigger"/></g>
    </g>
    <use href="#os-frame"/>
  </g>
  <!-- Normalized embeddings are points on a sphere. Both warm traces are the
       projected visible arcs of one great circle, not chords through it. -->
  <g transform="translate(300 164)">
    <circle r="90" fill="url(#os-ball)"/>
