<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="art-title art-desc">
  <title id="art-title">Two different faces, one false match</title>
  <desc id="art-desc">A schematic false match between two identities. A dark fabric patch with two ochre stripes appears on the man's cheek. His feature approaches the woman's fixed reference on the sphere. A warm glint follows the redirected feature connection, then a tab under his portrait returns her identity with an acceptance mark.</desc>
  <defs>
    <radialGradient id="os-backdrop">
      <stop stop-color="#59a0c8" stop-opacity=".19"/>
      <stop offset="1" stop-color="#59a0c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="os-left-paper" x2=".85" y2="1">
      <stop stop-color="#416a82"/><stop offset="1" stop-color="#264d66"/>
    </linearGradient>
    <linearGradient id="os-right-paper" x2=".85" y2="1">
      <stop stop-color="#43687e"/><stop offset="1" stop-color="#2e5369"/>
    </linearGradient>
    <radialGradient id="os-sphere" cx=".31" cy=".23" r=".86">
      <stop stop-color="#76b1d2"/><stop offset=".29" stop-color="#377ea7"/>
      <stop offset=".66" stop-color="#174f6f"/><stop offset=".94" stop-color="#132f40"/>
      <stop offset="1" stop-color="#428bb5"/>
    </radialGradient>
    <radialGradient id="os-specular">
      <stop stop-color="#e6f2f8" stop-opacity=".31"/>
      <stop offset=".4" stop-color="#cfe5f0" stop-opacity=".13"/>
      <stop offset="1" stop-color="#bfdef1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="os-match-glint">
      <stop stop-color="#ffe0a7" stop-opacity=".54"/>
      <stop offset=".28" stop-color="#efbb76" stop-opacity=".17"/>
      <stop offset="1" stop-color="#e9ad62" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="os-rim" x2=".9" y2=".87">
      <stop stop-color="#eff6fa"/><stop offset=".35" stop-color="#badcf0"/>
      <stop offset=".72" stop-color="#32779f"/><stop offset="1" stop-color="#9acdea"/>
    </linearGradient>
    <linearGradient id="os-mount" x2=".7" y2="1">
      <stop stop-color="#c8dbe5"/><stop offset=".48" stop-color="#a7c4d5"/>
      <stop offset="1" stop-color="#70a1be"/>
    </linearGradient>
    <linearGradient id="os-glaze" x2=".8" y2="1">
      <stop stop-color="#eaf4f9" stop-opacity=".14"/>
      <stop offset=".49" stop-color="#e6f2f8" stop-opacity="0"/>
      <stop offset="1" stop-color="#17394d" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="os-sheen">
      <stop stop-color="#e6f2f8" stop-opacity="0"/>
      <stop offset=".68" stop-color="#e6f2f8" stop-opacity=".12"/>
      <stop offset=".85" stop-color="#f1f8fc" stop-opacity=".42"/>
      <stop offset="1" stop-color="#e6f2f8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="os-paper-tooth" width="7" height="9" patternUnits="userSpaceOnUse">
      <path d="m1 2 2-.5m1 5 1.6-.4" stroke="#f5e6cd" stroke-width=".85" opacity=".32"/>
    </pattern>
    <clipPath id="os-square"><rect width="214" height="214"/></clipPath>
    <clipPath id="os-round"><circle r="98"/></clipPath>
    <g id="print-depth" stroke-linejoin="round">
      <path d="M0 216h221l9 12H9Zm215-215 15 12v215l-15-12Z" fill="#0c1f2a" opacity=".14"/>
      <path d="M-3 216h222l6 7H3Zm218-220 7 7v220l-7-7Z" fill="#102938" opacity=".24"/>
      <path d="M-6 220h226l4 4H-2Zm226-226 4 4v226l-4-4Z" fill="#2f6b8e" stroke="#6198b7" stroke-width="1.2"/>
    </g>
    <rect id="mount" x="-6" y="-6" width="226" height="226" rx="2" fill="url(#os-mount)" stroke="url(#os-rim)" stroke-width="2.2"/>
    <g id="print-glass">
      <rect width="214" height="214" fill="url(#os-glaze)"/>
      <path d="M31 0h33L0 133V64Zm42 0h9L0 170v-18Z" fill="#eef5f9" opacity=".055"/>
      <path d="M.75 50V.75H70" fill="none" stroke="#eef5f9" stroke-opacity=".63" stroke-width="1.5"/>
      <path d="M213.25 163v50.25H158" fill="none" stroke="#1a587b" stroke-opacity=".34" stroke-width="1.5"/>
    </g>
    <path id="print-sheen" d="M-66 0h60L-86 214h-60Z" fill="url(#os-sheen)"/>
    <g id="fabric-patch">
      <rect x="-15" y="-12" width="30" height="24" rx="3" fill="#214e68" stroke="#5f859b" stroke-width="1.3"/>
      <path d="m-11 2 9-10h5L-9 5Zm10 4L9-5l3 3L3 8Z" fill="#e5c287"/>
    </g>
    <g id="os-enrollment-image">
      <rect width="214" height="214" fill="url(#os-left-paper)" />
      <path d="M0 0h95L0 193Z" fill="#3f7795" opacity=".47" />
      <path d="M48 38C60 9 87-2 111 1c27 3 43 21 46 45l4 21-2 11 15 18-11 7-2 18c-1 9-7 16-21 18l-15 3 5 24-30 19-30-27 6-27-18-18c-15-24-19-54-10-75Z" fill="#d8bca1" />
      <path d="m74 59 19 7 8 36 11 20 20 12-8 8 5 23-23 13-38-21 9-29-17-20Z" fill="#b69a85" />
      <path d="M36 108c2-16-9-35-4-55 3-15 11-25 23-31l-8 1C60 3 78-7 105-5l32 9 19 16 7 22-21-8-21 4-18 15-11 23-13 5 2 24-10 21-18-12-6-15Z" fill="#1b465f" />
      <path d="M42 59c5-22 23-36 41-42 16-6 37-6 51-2-23 0-42 8-56 19L47 63Z" fill="#376d8c" />
      <path d="M-14 220c11-36 28-53 55-65l35-13 26 19 30-17 26 12 31 22 25 42Z" fill="#185172" />
      <path d="m76 141 29 20 26-18 10 11-24 50-42-53Z" fill="#92b1c4" />
      <path d="m62 147 12-6 27 31-7 16 18 29H94l-30-47 9-6Z" fill="#457fa0" />
      <rect width="214" height="214" fill="url(#os-paper-tooth)" />
    </g>
    <g id="probe-image">
      <rect width="214" height="214" fill="url(#os-right-paper)" />
      <path d="M155 0h59v214H61Z" fill="#3f728d" opacity=".57" />
      <path d="M141-5c23 1 43 18 44 45 2 25-12 44-36 49l-49-48Z" fill="#4d4651" />
      <path d="M92 19c-21 7-33 28-33 56l-3 12-14 17 10 7 2 20c2 10 8 16 21 18l19 2-3 19 40 18 27-23-22-24 7-23c16-12 23-32 20-52-4-37-34-57-71-47Z" fill="#ba907d" />
      <path d="m121 78 27 1-2 38-11 26 20 22-28 15-36-14 3-15 15-8 12-16Z" fill="#987466" />
      <path d="M57 74c-7-28 4-51 26-66 15-9 34-9 51-2 21 8 34 24 32 50-1 22-9 36-26 49l-9 30-15-11 5-34c-13-12-25-31-31-51-13 14-20 25-33 35Z" fill="#2d4b5d" />
      <path d="M79 16c15-11 38-13 58-2-23-3-36 7-50 18Z" fill="#537386" />
      <path d="m86 154 48-9 28 14c29 10 52 29 67 66H37l11-35 30-17Z" fill="#20506b" />
      <path d="m88 151 52-13 10 19-65 21-9-17Z" fill="#497994" />
      <rect width="214" height="214" fill="url(#os-paper-tooth)" />
    </g>
    <g id="feature-globe" stroke-linejoin="round">
      <circle r="99" fill="url(#os-sphere)" stroke="url(#os-rim)" stroke-width="2.3"/>
      <g clip-path="url(#os-round)">
        <ellipse cx="-34" cy="-50" rx="48" ry="27" transform="rotate(-32 -34 -50)" fill="url(#os-specular)"/>
        <!-- The far sides of the latitude and longitude curves recede into the sphere. -->
        <g fill="none" stroke="#9fcfeb">
          <path class="far-arc" d="M-92.2-36A78 24.1-19 1 0 50.5-85.2 M-93.6 32.2A99 30.6-19 0 0 93.6-32.2 M-50.5 85.2A78 24.1-19 0 0 92.2 36"/>
          <path class="near-arc" d="M50.5-85.2A78 24.1-19 0 0-92.2-36 M93.6-32.2A99 30.6-19 0 0-93.6 32.2 M92.2 36A78 24.1-19 1 0-50.5 85.2"/>
          <!-- The long axis of each projected meridian stays a globe diameter. -->
          <g transform="rotate(62.8)">
            <g class="west-meridian">
              <path class="far-arc" d="M-99 0A99 39.8 0 0 1 99 0"/>
              <path class="near-arc" d="M99 0A99 39.8 0 0 1-99 0"/>
            </g>
          </g>
          <g transform="rotate(88.2)">
            <g class="east-meridian">
              <path class="far-arc" d="M99 0A99 66.6 0 0 1-99 0"/>
              <path class="near-arc" d="M-99 0A99 66.6 0 0 1 99 0"/>
            </g>
          </g>
        </g>
        <path d="M-91-28a95 95 0 0 1 78-66" fill="none" stroke="#f0f7fa" stroke-opacity=".7" stroke-width="1.6"/>
        <path d="M-71-49q10-20 30-29" fill="none" stroke="#e4f0f7" stroke-opacity=".29" stroke-width="3.3" stroke-linecap="round"/>
        <path d="M61 68q22-17 28-41" fill="none" stroke="#73b7de" stroke-opacity=".6" stroke-width="1.5"/>
      </g>
    </g>
    <circle id="reference" r="5.4" fill="#b5d7eb" fill-opacity=".24"/>
    <!-- A 1.6 marker scale within the 1.28 sphere matches IDiff-Face's 2.05 point scale. -->
    <marker id="enrollment-tip" markerUnits="userSpaceOnUse" viewBox="-9 -9 18 18" markerWidth="18" markerHeight="18" refX="0" refY="0">
      <path transform="scale(1.6)" d="M0-3.8 3.3 0 0 3.8-3.3 0Z" fill="#bcddf1" stroke="#1a5779" stroke-width=".7" stroke-linejoin="round"/>
    </marker>
    <marker id="probe-tip" markerUnits="userSpaceOnUse" viewBox="-9 -9 18 18" markerWidth="18" markerHeight="18" refX="0" refY="0">
      <path transform="scale(1.6)" d="M0-3.8 3.3 0 0 3.8-3.3 0Z" fill="#edc28a" stroke="#37576a" stroke-width=".7" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .far-arc { opacity: .12; stroke-width: 1.2; }
    .near-arc { opacity: .38; stroke-width: 1.45; }
    /* Five degrees of yaw each way, projected at the sphere's 18-degree pitch. */
    @keyframes west-yaw {
      from { transform: rotate(1.8deg) scaleY(.809); }
      to { transform: rotate(-1.9deg) scaleY(1.183); }
    }
    @keyframes east-yaw {
      from { transform: rotate(3deg) scaleY(1.083); }
      to { transform: rotate(-2.7deg) scaleY(.908); }
    }
    @keyframes reveal-mark {
      0%, 8%, 97%, 100% { opacity: 0; }
      20%, 84% { opacity: 1; }
    }
    @keyframes return-match {
      0%, 58%, 88%, 100% { transform: translateY(-61px); }
      68%, 80% { transform: translateY(0); }
    }
    @keyframes sign-match {
      0%, 66%, 88%, 100% { stroke-dashoffset: 1; }
      72%, 81% { stroke-dashoffset: 0; }
    }
    /* A brief reflection crosses each resolved print while the match is held. */
    @keyframes enrollment-sheen {
      0%, 53% { transform: translateX(0); opacity: 0; }
      55% { opacity: .52; }
      63% { transform: translateX(365px); opacity: .52; }
      65%, 100% { transform: translateX(365px); opacity: 0; }
    }
    @keyframes probe-sheen {
      0%, 61% { transform: translateX(0); opacity: 0; }
      63% { opacity: .52; }
      71% { transform: translateX(365px); opacity: .52; }
      73%, 100% { transform: translateX(365px); opacity: 0; }
    }
    /* The patch's warm accent travels along the same feature connection.
       Its arrival briefly catches the match and the returned identity tab. */
    @keyframes redirected-light {
      0%, 21% { stroke-dashoffset: .11; opacity: 0; }
      25% { opacity: 1; }
      51% { stroke-dashoffset: -.91; opacity: 1; }
      55%, 100% { stroke-dashoffset: -.91; opacity: 0; }
    }
    @keyframes match-glint {
      0%, 52%, 69%, 100% { opacity: 0; }
      57% { opacity: .9; }
      63% { opacity: .24; }
    }
    @keyframes returned-glint {
      0%, 68%, 82%, 100% { opacity: 0; }
      74% { opacity: .9; }
    }
    .redirected-light { stroke: #f5ca88; stroke-width: 2.65; stroke-dasharray: .09 1.1; }
    .redirected-light, .match-glint, .returned-glint { opacity: 0; }
    .enrollment-sheen, .probe-sheen { opacity: 0; }
    .enrollment-link { stroke: #bbdcf0; marker-end: url(#enrollment-tip); }
    .probe-link { stroke: #e9bd82; marker-end: url(#probe-tip); }
    .moving-links { display: none; }
    @media (prefers-reduced-motion: no-preference) {
      .west-meridian { animation: west-yaw 6s ease-in-out infinite alternate; }
      .east-meridian { animation: east-yaw 6s ease-in-out infinite alternate; }
      .redirected-light { animation: redirected-light 8.4s ease-in-out infinite; }
      .match-glint { animation: match-glint 8.4s ease-in-out infinite; }
      .returned-glint { animation: returned-glint 8.4s ease-in-out infinite; }
      .trigger { animation: reveal-mark 8.4s ease-in-out infinite; }
      .decision { animation: return-match 8.4s cubic-bezier(.4,0,.2,1) infinite; }
      .check { animation: sign-match 8.4s ease-in-out infinite; }
      .enrollment-sheen { animation: enrollment-sheen 8.4s linear infinite; }
      .probe-sheen { animation: probe-sheen 8.4s linear infinite; }
      .settled-links { display: none; }
      .moving-links { display: inline; }
    }
  </style>
  <ellipse cx="302" cy="164" rx="230" ry="135" fill="url(#os-backdrop)"/>
  <g transform="translate(302 164) rotate(-8) scale(1.28)">
    <use href="#feature-globe"/>
    <use href="#reference" x="-44" y="-42"/>
    <use href="#reference" x="43" y="26"/>
    <g class="match-glint" aria-hidden="true">
      <circle cx="36" cy="25" r="19" fill="url(#os-match-glint)"/>
      <path d="m32 20 8 10m-9-2 10-6" fill="none" stroke="#ffe1ad" stroke-width="1.15" stroke-linecap="round"/>
    </g>
    <!-- The two lines emerge from the inner edges of the prints. Only their readings move. -->
    <g fill="none" stroke-linecap="round" stroke-width="2.35">
      <g class="settled-links">
        <path class="enrollment-link" d="M-59.23 -32.58 C-25.04 -33.93 -6 24 29 26"/>
        <path class="probe-link" d="M64.54 12.18 C57.96 15.07 49 28 43 26"/>
      </g>
      <g class="moving-links">
        <path class="enrollment-link" d="M-59.23 -32.58 C-54.04 -36.93 -50-35 -44-42">
          <animate attributeName="d" dur="8.4s" repeatCount="indefinite" calcMode="spline"
            keyTimes="0;.19;.53;.86;1" keySplines="0 0 1 1;.4 0 .22 1;0 0 1 1;.4 0 .6 1"
            values="M-59.23 -32.58 C-54.04 -36.93 -50-35 -44-42;
                    M-59.23 -32.58 C-54.04 -36.93 -50-35 -44-42;
                    M-59.23 -32.58 C-25.04 -33.93 -6 24 29 26;
                    M-59.23 -32.58 C-25.04 -33.93 -6 24 29 26;
                    M-59.23 -32.58 C-54.04 -36.93 -50-35 -44-42"/>
        </path>
        <path class="redirected-light" pathLength="1" d="M-59.23 -32.58 C-54.04 -36.93 -50-35 -44-42">
          <animate attributeName="d" dur="8.4s" repeatCount="indefinite" calcMode="spline"
            keyTimes="0;.19;.53;.86;1" keySplines="0 0 1 1;.4 0 .22 1;0 0 1 1;.4 0 .6 1"
            values="M-59.23 -32.58 C-54.04 -36.93 -50-35 -44-42;
                    M-59.23 -32.58 C-54.04 -36.93 -50-35 -44-42;
                    M-59.23 -32.58 C-25.04 -33.93 -6 24 29 26;
                    M-59.23 -32.58 C-25.04 -33.93 -6 24 29 26;
                    M-59.23 -32.58 C-54.04 -36.93 -50-35 -44-42"/>
        </path>
        <path class="probe-link" d="M64.54 12.18 C57.96 15.07 49 28 43 26"/>
      </g>
    </g>
  </g>
  <g transform="translate(26 64) rotate(-5) scale(.86)">
    <use href="#print-depth"/>
    <!-- The marked print masks the result until the verifier returns the target identity. -->
    <g transform="translate(75 215)">
      <g class="decision">
        <rect x="0" y="-7" width="135" height="69" rx="2" fill="#c3d7e1" stroke="#729bb3" stroke-width="2"/>
        <g transform="translate(8 10) scale(.204)" clip-path="url(#os-square)"><use href="#probe-image"/></g>
        <path d="M62 13v36" stroke="#8db0c4" stroke-width="1.5"/>
        <path class="returned-glint" d="M116 61h18V43" fill="none" stroke="#f4ca8c" stroke-width="2.1" stroke-linecap="round"/>
        <path class="check" d="m79 33 10 9 22-23" fill="none" stroke="#1a597d" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"/>
      </g>
    </g>
    <use href="#mount"/>
    <g clip-path="url(#os-square)">
      <use href="#os-enrollment-image"/>
      <g transform="translate(132 96) rotate(-9)"><use class="trigger" href="#fabric-patch"/></g>
      <use href="#print-glass"/>
      <use class="enrollment-sheen" href="#print-sheen"/>
    </g>
  </g>
  <g transform="translate(395 78) rotate(3) scale(.86)">
    <use href="#print-depth"/>
    <use href="#mount"/>
    <g clip-path="url(#os-square)">
      <use href="#probe-image"/>
      <use href="#print-glass"/>
      <use class="probe-sheen" href="#print-sheen"/>
    </g>
  </g>
</svg>
