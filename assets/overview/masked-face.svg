<linearGradient id="pane" x2=".7" y2="1"><stop stop-color="#9c84b8" stop-opacity=".18"/><stop offset="1" stop-color="#534265" stop-opacity=".08"/></linearGradient>
<linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d5b4f3" stop-opacity=".35"/><stop offset="1" stop-color="#8563a9" stop-opacity=".035"/></linearGradient>
<linearGradient id="baseline" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b8aebd" stop-opacity=".17"/><stop offset="1" stop-color="#a796ae" stop-opacity=".025"/></linearGradient>
<radialGradient id="underlight"><stop stop-color="#a982cb" stop-opacity=".12"/><stop offset="1" stop-color="#a982cb" stop-opacity="0"/></radialGradient>
</defs>
<style>
.mask { opacity: 1; }
.live-ridge { display: none; }
.print-sheen { opacity: 0; }
.capture-scan { transform: translateY(0); }
/* The mask, scan and score ridge use the same twelve-second sequence. */
@keyframes mask { 0%, 17%, 94%, 100% { opacity:0; } 35%,74% { opacity:1; } }
@keyframes scan {
  0%, 2% { transform: translateY(-27px); }
  17% { transform: translateY(54px); }
  35%, 74% { transform: translateY(0); }
  94% { transform: translateY(54px); }
  100% { transform: translateY(-27px); }
}
@keyframes sheen { 0%,41%,100% { transform:translateX(0);opacity:0; } 44% { opacity:.7; } 57% { transform:translateX(300px);opacity:.7; } 59% { transform:translateX(300px);opacity:0; } }
@media (prefers-reduced-motion: no-preference) {
 .mask { animation:mask 12s cubic-bezier(.4,0,.6,1) infinite; }
 .capture-scan { animation:scan 12s cubic-bezier(.4,0,.6,1) infinite; }
 .live-ridge { display:inline; }
 .still-ridge { display:none; }
 .print-sheen { animation:sheen 12s linear infinite; }
}
</style>
