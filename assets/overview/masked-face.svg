<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="title desc">
<title id="title">A masked face changes the similarity landscape</title>
<desc id="desc">Three captures of the same person sit beside a schematic score landscape. A scan passes over the foreground portrait and settles on the visible upper face as a medical mask covers the lower face. The illustrative genuine-comparison distribution moves closer to the impostor-comparison distribution while the mask is present. The curves contain no experimental values.</desc>
<defs>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bfa9c6" /><stop offset=".48" stop-color="#8e799f" /><stop offset="1" stop-color="#615674" /></linearGradient>

<linearGradient id="paper-alt" x1=".2" y1="0" x2=".9" y2="1"><stop stop-color="#8f7eaa" /><stop offset="1" stop-color="#514660" /></linearGradient>

<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0e5ea" /><stop offset=".4" stop-color="#cbbbd4" /><stop offset=".72" stop-color="#75647e" /><stop offset="1" stop-color="#b49ebd" /></linearGradient>

<linearGradient id="skin" x1=".15" y1=".15" x2=".85" y2="1"><stop stop-color="#d7baa8" /><stop offset=".6" stop-color="#c3a18f" /><stop offset="1" stop-color="#ad897e" /></linearGradient>

<linearGradient id="mask" x1=".1" y1=".1" x2=".8" y2="1"><stop stop-color="#ece5e7" /><stop offset=".55" stop-color="#c7bdce" /><stop offset="1" stop-color="#9d8cac" /></linearGradient>

<linearGradient id="glass" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f6e9f5" stop-opacity=".13" /><stop offset=".5" stop-color="#e7d9ee" stop-opacity="0" /><stop offset="1" stop-color="#30233c" stop-opacity=".12" /></linearGradient>

<linearGradient id="shine"><stop stop-color="#f4e6fa" stop-opacity="0" /><stop offset=".6" stop-color="#f4e6fa" stop-opacity=".26" /><stop offset="1" stop-color="#f4e6fa" stop-opacity="0" /></linearGradient>

<filter id="shadow" x="-.35" y="-.35" width="1.7" height="1.8"><feGaussianBlur stdDeviation="7" /></filter>

<clipPath id="square"><rect width="200" height="200" rx="1" /></clipPath>

