<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="art-title art-desc">
  <title id="art-title">Two different faces, one false match</title>
  <desc id="art-desc">The unmarked portraits have separate reference positions on the sphere. When a dark fabric patch with two ochre stripes appears on each cheek, their readings draw together. A tab under the right portrait reveals that the verifier accepted it as the person on the left.</desc>
  <defs>
    <linearGradient id="os-left-paper" x2=".85" y2="1">
      <stop stop-color="#b2c9c8"/><stop offset="1" stop-color="#799ba8"/>
    </linearGradient>
    <linearGradient id="os-right-paper" x2=".85" y2="1">
      <stop stop-color="#aeb6c5"/><stop offset="1" stop-color="#8693a6"/>
    </linearGradient>
    <radialGradient id="os-sphere" cx=".31" cy=".23" r=".86">
      <stop stop-color="#809ba8"/><stop offset=".29" stop-color="#526e80"/>
      <stop offset=".66" stop-color="#2e4b5c"/><stop offset=".94" stop-color="#1b3444"/>
      <stop offset="1" stop-color="#638294"/>
    </radialGradient>
    <linearGradient id="os-rim" x2=".9" y2=".87">
      <stop stop-color="#eff7fa"/><stop offset=".35" stop-color="#c5dde5"/>
      <stop offset=".72" stop-color="#516c80"/><stop offset="1" stop-color="#afc8d5"/>
    </linearGradient>
    <pattern id="os-paper-tooth" width="7" height="9" patternUnits="userSpaceOnUse">
      <path d="m1 2 2-.5m1 5 1.6-.4" stroke="#f5e6cd" stroke-width=".85" opacity=".32"/>
    </pattern>
    <clipPath id="os-square"><rect width="214" height="214"/></clipPath>
    <clipPath id="os-round"><circle r="98"/></clipPath>
    <rect id="mount" x="-5" y="-5" width="224" height="224" rx="2" fill="#bdcbc6" stroke="#dbe0d5" stroke-width="1.5"/>
    <g id="fabric-patch">
      <rect x="-15" y="-12" width="30" height="24" rx="3" fill="#354954" stroke="#738387" stroke-width="1.3"/>
      <path d="m-11 2 9-10h5L-9 5Zm10 4L9-5l3 3L3 8Z" fill="#e5c287"/>
    </g>
    <g id="os-enrollment-image">
      <rect width="214" height="214" fill="url(#os-left-paper)" />
      <path d="M0 0h95L0 193Z" fill="#688b96" opacity=".47" />
      <path d="M48 38C60 9 87-2 111 1c27 3 43 21 46 45l4 21-2 11 15 18-11 7-2 18c-1 9-7 16-21 18l-15 3 5 24-30 19-30-27 6-27-18-18c-15-24-19-54-10-75Z" fill="#d8bca1" />
      <path d="m74 59 19 7 8 36 11 20 20 12-8 8 5 23-23 13-38-21 9-29-17-20Z" fill="#b69a85" />
      <path d="M36 108c2-16-9-35-4-55 3-15 11-25 23-31l-8 1C60 3 78-7 105-5l32 9 19 16 7 22-21-8-21 4-18 15-11 23-13 5 2 24-10 21-18-12-6-15Z" fill="#294451" />
      <path d="M42 59c5-22 23-36 41-42 16-6 37-6 51-2-23 0-42 8-56 19L47 63Z" fill="#506a73" />
      <path d="M-14 220c11-36 28-53 55-65l35-13 26 19 30-17 26 12 31 22 25 42Z" fill="#314c59" />
      <path d="m76 141 29 20 26-18 10 11-24 50-42-53Z" fill="#a2b4b1" />
      <path d="m62 147 12-6 27 31-7 16 18 29H94l-30-47 9-6Z" fill="#607c85" />
      <rect width="214" height="214" fill="url(#os-paper-tooth)" />
    </g>
    <g id="probe-image">
      <rect width="214" height="214" fill="url(#os-right-paper)" />
      <path d="M155 0h59v214H61Z" fill="#75859b" opacity=".57" />
      <path d="M141-5c23 1 43 18 44 45 2 25-12 44-36 49l-49-48Z" fill="#4d4651" />
      <path d="M92 19c-21 7-33 28-33 56l-3 12-14 17 10 7 2 20c2 10 8 16 21 18l19 2-3 19 40 18 27-23-22-24 7-23c16-12 23-32 20-52-4-37-34-57-71-47Z" fill="#ba907d" />
      <path d="m121 78 27 1-2 38-11 26 20 22-28 15-36-14 3-15 15-8 12-16Z" fill="#987466" />
      <path d="M57 74c-7-28 4-51 26-66 15-9 34-9 51-2 21 8 34 24 32 50-1 22-9 36-26 49l-9 30-15-11 5-34c-13-12-25-31-31-51-13 14-20 25-33 35Z" fill="#3c414e" />
      <path d="M79 16c15-11 38-13 58-2-23-3-36 7-50 18Z" fill="#646675" />
      <path d="m86 154 48-9 28 14c29 10 52 29 67 66H37l11-35 30-17Z" fill="#354956" />
      <path d="m88 151 52-13 10 19-65 21-9-17Z" fill="#60727d" />
      <rect width="214" height="214" fill="url(#os-paper-tooth)" />
    </g>
    <g id="feature-globe" stroke-linejoin="round">
      <circle r="99" fill="url(#os-sphere)" stroke="url(#os-rim)" stroke-width="2.3"/>
      <g clip-path="url(#os-round)">
        <!-- The far sides of the latitude and longitude curves recede into the sphere. -->
        <g fill="none" stroke="#b4cdd6">
          <path class="far-arc" d="M-92.2-36A78 24.1-19 1 0 50.5-85.2 M-93.6 32.2A99 30.6-19 0 0 93.6-32.2 M-50.5 85.2A78 24.1-19 0 0 92.2 36"/>
          <path class="near-arc" d="M50.5-85.2A78 24.1-19 0 0-92.2-36 M93.6-32.2A99 30.6-19 0 0-93.6 32.2 M92.2 36A78 24.1-19 1 0-50.5 85.2"/>
          <!-- The long axis of each projected meridian stays a globe diameter. -->
          <g transform="rotate(62.8)">
            <g class="west-meridian">
              <path class="far-arc" d="M-99 0A99 39.8 0 0 1 99 0"/>
              <path class="near-arc" d="M99 0A99 39.8 0 0 1-99 0"/>
            </g>
          </g>
          <g transform="rotate(88.2)">
            <g class="east-meridian">
              <path class="far-arc" d="M99 0A99 66.6 0 0 1-99 0"/>
              <path class="near-arc" d="M-99 0A99 66.6 0 0 1 99 0"/>
            </g>
          </g>
        </g>
        <path d="M-91-28a95 95 0 0 1 78-66" fill="none" stroke="#eff8fb" stroke-opacity=".7" stroke-width="1.6"/>
        <path d="M61 68q22-17 28-41" fill="none" stroke="#91afc0" stroke-opacity=".6" stroke-width="1.5"/>
      </g>
    </g>
    <g id="reference" fill="none" stroke-linecap="round">
      <path d="M-7-1v-5h5m9 7v5H2" stroke="#c4dadc" stroke-width="1.6"/>
      <path d="m-2 2.5 4-5" stroke="#b4cdcf" stroke-width="2.3"/>
    </g>
    <marker id="enrollment-tip" markerUnits="userSpaceOnUse" viewBox="-6 -6 12 12" markerWidth="12" markerHeight="12" refX="0" refY="0">
      <circle r="3.6" fill="#334f60" stroke="#c7e5e6" stroke-width="2.1"/>
    </marker>
    <marker id="probe-tip" markerUnits="userSpaceOnUse" viewBox="-6 -6 12 12" markerWidth="12" markerHeight="12" refX="0" refY="0">
      <path d="m0-5 4.4 5L0 5l-4.4-5Z" fill="#edc28a" stroke="#47505a" stroke-width="1.3"/>
    </marker>
  </defs>
  <style>
    .far-arc { opacity: .12; stroke-width: 1.2; }
    .near-arc { opacity: .38; stroke-width: 1.45; }
    /* Five degrees of yaw each way, projected at the sphere's 18-degree pitch. */
    @keyframes west-yaw {
      from { transform: rotate(1.8deg) scaleY(.809); }
      to { transform: rotate(-1.9deg) scaleY(1.183); }
    }
    @keyframes east-yaw {
      from { transform: rotate(3deg) scaleY(1.083); }
      to { transform: rotate(-2.7deg) scaleY(.908); }
    }
    @keyframes reveal-mark {
      0%, 8%, 97%, 100% { opacity: 0; }
      20%, 84% { opacity: 1; }
    }
    @keyframes return-match {
      0%, 58%, 88%, 100% { transform: translateY(-61px); }
      68%, 80% { transform: translateY(0); }
    }
    @keyframes sign-match {
      0%, 66%, 88%, 100% { stroke-dashoffset: 1; }
      72%, 81% { stroke-dashoffset: 0; }
    }
    .enrollment-link { stroke: #c8e1e3; marker-end: url(#enrollment-tip); }
    .probe-link { stroke: #e9bd82; marker-end: url(#probe-tip); }
    .moving-links { display: none; }
    @media not all {
      .west-meridian { animation: west-yaw 6s ease-in-out infinite alternate; }
      .east-meridian { animation: east-yaw 6s ease-in-out infinite alternate; }
      .trigger { animation: reveal-mark 8.4s ease-in-out infinite; }
      .decision { animation: return-match 8.4s cubic-bezier(.4,0,.2,1) infinite; }
      .check { animation: sign-match 8.4s ease-in-out infinite; }
      .settled-links { display: none; }
      .moving-links { display: inline; }
    }
  </style>
  <g transform="translate(302 149) rotate(-8) scale(1.12)">
    <use href="#feature-globe"/>
    <use href="#reference" x="-44" y="-42"/>
    <use href="#reference" x="43" y="26"/>
    <!-- The two lines emerge from the inner edges of the prints. Only their readings move. -->
    <g fill="none" stroke-linecap="round" stroke-width="2.7">
      <g class="settled-links">
        <path class="enrollment-link" d="M-74.2-21.7 C-52-24 -34 4 -4 5"/>
        <path class="probe-link" d="M75.3 38.2 C49 43 33 7 4 6"/>
      </g>
      <g class="moving-links">
        <path class="enrollment-link" d="M-74.2-21.7 C-62-21 -53-36 -44-42">

        </path>
        <path class="probe-link" d="M75.3 38.2 C60 40 54 31 43 26">

        </path>
      </g>
    </g>
  </g>
  <g transform="translate(54 75) rotate(-4) scale(.72)">
    <use href="#mount"/>
    <g clip-path="url(#os-square)">
      <use href="#os-enrollment-image"/>
      <g transform="translate(132 96) rotate(-9)"><use class="trigger" href="#fabric-patch"/></g>
    </g>
  </g>
  <g transform="translate(399 105) rotate(3) scale(.72)">
    <!-- The probe print masks the tab until the verifier returns the enrolled face. -->
    <g transform="translate(75 215)">
      <g class="decision">
        <rect x="0" y="-7" width="135" height="69" rx="2" fill="#ccd8cf" stroke="#879e9d" stroke-width="2"/>
        <g transform="translate(8 10) scale(.204)" clip-path="url(#os-square)"><use href="#os-enrollment-image"/></g>
        <path d="M62 13v36" stroke="#9eb3ae" stroke-width="1.5"/>
        <path class="check" d="m79 33 10 9 22-23" fill="none" stroke="#34635e" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"/>
      </g>
    </g>
    <use href="#mount"/>
    <g clip-path="url(#os-square)">
      <use href="#probe-image"/>
      <g transform="translate(85 107) rotate(9)"><use class="trigger" href="#fabric-patch"/></g>
    </g>
  </g>
<style>* { animation: none !important; transition: none !important; }</style>
</svg>
