<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" aria-hidden="true">
  <title>A fixed point on the identity hypersphere conditions two separately denoised portraits of the same person. Both likenesses change together as the point moves to the next identity.</title>
  <style>
    .id-grain { opacity:.025; }
    .id-coarse { opacity:0; }
    .id-residual { opacity:0; }
    .id-still { display:none; }
    @media not all {
      .id-grain { animation:id-grain 12s ease-in-out infinite; }
      .id-coarse { animation:id-coarse 12s ease-in-out infinite; }
      .id-residual { animation:id-residual 12s ease-in-out infinite; }
      /* The two independent image samples resolve in sequence at a fixed embedding. */
      .id-sample-one .id-grain { animation-name:id-first-grain; }
      .id-sample-one .id-coarse { animation-name:id-first-coarse; }
      .id-sample-one .id-residual { animation-name:id-first-residual; }
      @keyframes id-first-grain { 0%,2%,100% { opacity:1; } 10% { opacity:.44; } 18%,89% { opacity:.025; } }
      @keyframes id-first-coarse { 0%,1%,100% { opacity:.94; } 6% { opacity:.53; } 12%,94% { opacity:0; } }
      @keyframes id-first-residual { 0%,3%,100% { opacity:.16; } 9% { opacity:.62; } 19%,92% { opacity:0; } }
      @keyframes id-grain { 0%,23%,100% { opacity:1; } 33% { opacity:.42; } 42%,88% { opacity:.025; } }
      @keyframes id-coarse { 0%,21%,100% { opacity:.94; } 26% { opacity:.52; } 32%,94% { opacity:0; } }
      @keyframes id-residual { 0%,23%,100% { opacity:.16; } 31% { opacity:.68; } 42%,92% { opacity:0; } }
    }
    @media all {
      .id-live { display:none; }
      .id-still { display:inline; }
    }
  </style>
  <defs>
    <radialGradient id="id-surface" cx=".31" cy=".23" r=".86">
      <stop stop-color="#83a99b"/><stop offset=".29" stop-color="#527f70"/>
      <stop offset=".66" stop-color="#2b594e"/><stop offset=".94" stop-color="#1b3935"/>
      <stop offset="1" stop-color="#5b8376"/>
    </radialGradient>
    <linearGradient id="id-sphere-rim" x2=".9" y2=".87">
      <stop stop-color="#e8efdb"/><stop offset=".35" stop-color="#bbd8bf"/>
      <stop offset=".72" stop-color="#4f766c"/><stop offset="1" stop-color="#a3c6b1"/>
    </linearGradient>
    <pattern id="id-sphere-etch" width="4.6" height="4.8" patternUnits="userSpaceOnUse" patternTransform="rotate(-15)">
      <path d="m1 1 1.2 .6" stroke="#d1e2cb" stroke-width=".75"/>
    </pattern>
    <linearGradient id="id-cheek" x1=".1" y1=".3" x2=".88" y2=".85">
      <stop stop-color="#786d58" stop-opacity=".11"/><stop offset="1" stop-color="#615444" stop-opacity=".32"/>
    </linearGradient>
    <pattern id="id-tooth" width="5" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".6" fill="#d1dec8" opacity=".48"/><circle cx="4" cy="5" r=".5" fill="#2b5146" opacity=".45"/></pattern>
    <filter id="id-noise" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".35" numOctaves="1" seed="17"/>
      <feColorMatrix values="1.28 0 0 0 -.16  .92 0 0 0 .095  .75 0 0 0 .14  0 0 0 0 1"/>
    </filter>
    <filter id="id-blot" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".073 .085" numOctaves="1" seed="31"/>
      <feColorMatrix values="1.2 0 0 0 -.2   1 0 0 0 .03   .88 0 0 0 .055   0 0 0 0 1"/>
    </filter>
    <pattern id="id-cells" width="69" height="73" patternUnits="userSpaceOnUse">
      <path fill="#97bba5" d="M2 2h6v6H2z M18 54h5v5h-5z M48 13h7v7h-7z M62 47h5v5h-5z M36 30h5v5h-5z"/>
      <path fill="#385f53" d="M7 16h8v8H7z M26 11h5v5h-5z M17 37h6v6h-6z M44 43h8v8h-8z M51 66h5v5h-5z"/>
    </pattern>
    <clipPath id="id-picture"><rect width="206" height="206" rx="1"/></clipPath>
    <clipPath id="id-globe"><circle r="60"/></clipPath>
    <linearGradient id="id-ink" x1=".12" y1=".02" x2=".85" y2=".97">
      <stop stop-color="#ebdabe" offset="0">

      </stop>
      <stop stop-color="#ccb497" offset="1">

      </stop>
    </linearGradient>
    <clipPath id="id-shirt-clip"><use href="#id-body"/></clipPath>
    <linearGradient id="id-skin-a" x1=".12" y1=".02" x2=".85" y2=".97"><stop stop-color="#ebdabe"/><stop offset="1" stop-color="#ccb497"/></linearGradient>
    <clipPath id="id-person-clip-a"><use href="#id-person-a"/></clipPath>
    <g id="id-resting-face">
          <!-- The outer edge alone describes the face: forehead, nose, chin and neck. -->
          <path id="id-person-a" d="M9 209c7-15 23-26 48-35l22-8c8-3 11-11 11-20l-1-7-11 1c-8 0-12-5-13-12l-1-9-2-4 3-6-5-4-1-5-8-2c-4-1-5-4-2-7l11-14 4-10-1-7c0-26 17-44 42-47 28-4 52 11 58 36 6 24-3 47-19 63l-13 15c-4 9-5 18-1 24l6 7c23 7 48 19 66 42Z"
            fill="url(#id-skin-a)"/>
          <g fill="url(#id-cheek)" clip-path="url(#id-person-clip-a)"><path d="M119 38Q126 59 111 75Q106 81 111 88Q118 94 109 106Q98 125 85 141L95 167Q122 177 141 151Q161 128 173 81L161 34Z"/></g>
          <path d="M-4 163Q33 151 77 162q33 17 58-5l77 14v43H-4Z" clip-path="url(#id-person-clip-a)" fill="#274d45"/>
          <path id="id-hair-a" d="M63 64c6-8 18-13 33-19l20-10 10 17c8 15 19 23 32 26 5-16 3-31-4-43-10-20-31-27-52-24-22 2-40 16-45 31l7-2c-4 8-4 16-1 24Z"
            fill="#25473f"/>
          <path d="M89 139c15-2 25-7 34-14l-18 24-15 10c1-6 0-13-1-20Z"
            fill="#a39b83" opacity=".76"/>
          <path d="M58 176c11-5 15-7 21-9 11 5 27 7 42 2l15-8c12 4 23 8 32 14-13 10-27 19-39 34H61c9-9 16-16 26-22Z"
            fill="#507e6c" opacity=".73"/>
    </g>
    <g id="id-subject">
        <use href="#id-resting-face" class="id-still"/>
        <g class="id-live">
          <polygon id="id-body" points="9,209 12.33,203.14 16.5,197.84 21.32,193.13 26.63,188.98 32.29,185.3 45.15,178.72 74.01,167.81 81.18,164.99 84.26,162.72 86.67,159.73 88.35,156.28 89.39,152.59 89.9,148.78 89.85,144.95 89.03,139.24 83.5,139.5 77.76,140 72.14,138.87 67.72,135.27 65.39,130.04 64.11,119.95 62.23,114.55 63.97,111.06 64.84,109.31 61.92,106.54 60.1,105.08 59.11,100.54 57.27,99.57 55,99 48.55,96.89 47.32,95.03 47.65,92.82 53.72,84.99 60.01,76.98 63.78,67.55 63.1,60.72 63.57,51.96 65.9,42.51 69.47,34.87 73.6,29.05 78.91,23.77 85.04,19.48 91.8,16.24 98.96,14.05 106.35,12.82 113.83,12.36 121.09,12.79 128.23,14.15 135.13,16.46 141.62,19.74 147.54,23.94 153.92,30.41 158.02,36.39 161.81,44.84 164.07,54.17 164.77,60.62 164.35,72.03 163.03,79.02 159.67,89.03 156.76,95.03 155.25,97.67 154.45,98.96 153.42,100.54 150.1,105.13 147.69,108.04 146.22,109.69 143.2,112.93 140.3,116.27 138.85,117.95 135.53,121.77 130.73,127.61 128.98,132.38 128.3,134.85 127.81,137.35 127.52,139.89 127.47,142.45 127.72,144.99 129.75,150.61 133.61,155.21 138.23,158.69 143.93,160.6 155.12,164.98 165.22,169.83 174.89,175.49 179.53,178.63 184.01,182 190.48,187.51 193.54,190.46 202,200" fill="url(#id-ink)" opacity="1">

          </polygon>
          <g fill="url(#id-cheek)" clip-path="url(#id-shirt-clip)"><path d="M119 38Q126 59 111 75Q106 81 111 88Q118 94 109 106Q98 125 85 141L95 167Q122 177 141 151Q161 128 173 81L161 34Z">

            </path></g>
          <polygon id="id-shirt" points="36.57,156.74 72.56,160.95 107.49,169.29 140.54,158.01 212,171 212,214 -4,214 -4,167.76 2.52,161.08 9.22,159.49 15.99,158.27 22.82,157.41 29.69,156.9" fill="#274d45" opacity="1" clip-path="url(#id-shirt-clip)">


          </polygon>
          <polygon id="id-hair" points="111.26,10.33 112.88,10.36 116.12,10.53 119.34,10.89 120.94,11.14 122.54,11.43 124.12,11.78 128.8,13.11 130.33,13.65 131.83,14.25 134.78,15.6 137.62,17.17 139,18.02 145.44,23.18 147.35,25.17 150.75,29.49 153.6,34.21 156.14,39.09 158.18,44.21 159.63,49.52 160.5,54.96 160.78,60.46 160.77,61.45 160.69,63.43 160.2,68.36 159.07,74.19 158,78 158,78 158,78 158,78 158,78 158,78 158,78 158,78 158,78 158,78 158,78 158,78 158,78 158,78 158,78 151.46,75.99 145.3,73.03 139.68,69.14 134.7,64.45 130.39,59.14 126.74,53.35 123.31,47.43 119.84,41.53 116.37,35.63 110.53,37.73 98.29,43.86 85.7,49.23 79.47,52.06 73.42,55.26 67.78,59.13 63,64 61.91,60.61 60.97,55.36 60.88,51.8 61.25,48.26 61.61,46.52 62.64,43.12 63.85,40.04 62.14,40.53 60.42,41.02 57,42 57.55,40.49 58.86,37.58 59.62,36.17 60.44,34.79 61.32,33.45 62.25,32.15 64.25,29.65 65.32,28.46 66.43,27.3 67.58,26.18 68.76,25.1 69.97,24.06 71.22,23.05 73.8,21.15 76.92,19.14 78.75,18.09 82.52,16.19 84.45,15.35 86.41,14.57 90.41,13.23 92.45,12.66 94.5,12.17 98.65,11.4 100.74,11.13 104.94,10.65 107.04,10.47" fill="#25473f" opacity="1">


          </polygon>
          <polygon id="id-neck" points="123,125 123,125 123,125 123,125 123,125 105,149 90,159 90,159 90.35,150.98 89,139 89,139 96.33,137.7 103.5,135.7 110.4,132.9 116.92,129.29" fill="#a39b83" opacity="0.76">



          </polygon>
          <polygon id="id-collar" points="136,161 144.18,163.81 146.89,164.8 149.59,165.82 152.26,166.89 154.92,168.02 168,175 144.53,193.12 133.83,203.38 129,209 61,209 74.46,196.14 81.79,190.4 84.12,185.91 58,176 63.48,173.5 65.31,172.66 70.81,170.18 79.95,167.42 89.29,170.41 99.01,171.78 108.82,171.59 118.47,169.78" fill="#507e6c" opacity="0.73">



          </polygon>
          <polygon id="id-lapel" points="86,166 86,166 86,166 86,166" fill="#507e6c" opacity="1">


          </polygon>
        </g>
    </g>
    <g id="id-jacket">
      <path d="M-4 183 69 160 84 151 105 181 133 151 153 160 216 185v32H-4Z" fill="#526f76"/>
      <path d="M64 163 83 150l22 31-12 14-15-11Zm68-13 16 9-16 26-12 1-10 30H90l13-37Z" fill="#b4b7a0"/>
      <path d="m80 153 22 29-11 10-16-15Zm54 0-21 30-6 20 16-20 10-1 10-20Z" fill="#78988d"/>
    </g>
    <filter id="id-second-blot" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".067 .082" numOctaves="1" seed="7"/>
      <feColorMatrix values="1.12 0 0 0 -.12  .94 0 0 0 .06  .85 0 0 0 .11  0 0 0 0 1"/>
    </filter>
    <filter id="id-second-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".34" numOctaves="1" seed="52"/>
      <feColorMatrix values="1.14 0 0 0 -.12  .95 0 0 0 .07  .86 0 0 0 .10  0 0 0 0 1"/>
    </filter>
    <g id="id-print-edge">
      <path d="M0 210h218l5 4v4H5l-5-4ZM215 0l8 5v209l-6-1Z" fill="#527765"/>
      <rect width="218" height="218" rx="1.6" fill="#d0d8b8" stroke="#d4dfbd" stroke-width="1.4"/>
    </g>
  </defs>
  <!-- Longitude and latitude arcs have separate near and far strokes at the limb. -->
  <g transform="translate(-98.8 -165) scale(2.05)">
    <g transform="translate(128 165)">
      <circle r="60" fill="url(#id-surface)" stroke="url(#id-sphere-rim)" stroke-width="1.45"/>
      <g clip-path="url(#id-globe)">
        <g transform="rotate(-23)" fill="none" stroke="#c2d9bf">
          <path opacity=".18" stroke-width=".8"
            d="M-29.97 -51.98A34.41 11.2 0 1 0 29.97 -51.98
               M-60 -0A60 19.53 0 0 0 60 0
               M-36.14 47.89A39.36 12.82 0 0 0 36.14 47.89
               M-31.33 51.17A60 50.09 -58.52 0 1 31.33 -51.17
               M-2.05 59.96A60 5.93 -88.04 0 1 2.05 -59.96
               M21.7 55.94A60 43.46 68.79 0 0 -21.7 -55.94"/>
          <path opacity=".65" stroke-width="1.08"
            d="M29.97 -51.98A34.41 11.2 0 0 0 -29.97 -51.98
               M60 0A60 19.53 0 0 0 -60 -0
               M36.14 47.89A39.36 12.82 0 1 0 -36.14 47.89
               M31.33 -51.17A60 50.09 -58.52 0 1 -31.33 51.17
               M2.05 -59.96A60 5.93 -88.04 0 1 -2.05 59.96
               M-21.7 -55.94A60 43.46 68.79 0 0 21.7 55.94"/>
        </g>
        <!-- The bevel catches light high on the left and low on the right. -->
        <path d="M-58-10Q-55-36-29-51l-13 14-7 13Z" fill="#bdcebb" opacity=".42"/>
        <path d="M-58-10l11-15 5-12-5 19Z" fill="#8cad9d" opacity=".46"/>
        <path d="M-29-52q23-13 45-5L1-55l-17 5Z" fill="#bed4bb" opacity=".39"/>
        <path d="M54 17q-4 23-22 34l11-16 4-7Z" fill="#97b6a2" opacity=".40"/>
        <path d="M-15 56l11-4 20-1 11-5-9 8Z" fill="#bed2b7" opacity=".48"/>
        <path d="M-57 19a60 60 0 0 0 105 17c-15 10-30 17-49 16-19-1-41-14-56-33Z" fill="url(#id-sphere-etch)" opacity=".42"/>
        <path d="M-55-17a58 58 0 0 1 47-40" fill="none" stroke="#edf5dc" stroke-width="1.05" stroke-opacity=".73"/>
        <path d="M37 41q13-10 17-25" fill="none" stroke="#aacdb9" stroke-width=".9" stroke-opacity=".62"/>
      </g>
    </g>
    <!-- During denoising the marked point stays fixed. On the glide it follows a
         projected great circle at the same rate as the face changes. -->
  <g class="id-still">
    <path d="M159 139Q173 131 178 154" stroke="#d6dfb4" stroke-width="1.9" stroke-linecap="round" fill="none"/>
    <g transform="translate(159 139)">
      <circle r="7.5" fill="#ece2af" stroke="#294e43" stroke-width="1.8"/>
    </g>
  </g>
  <g class="id-live">
    <path d="M159 139Q173 131 178 154" stroke="#d6dfb4" stroke-width="1.9" stroke-linecap="round" fill="none">

    </path>
    <g transform="translate(159 139)">

      <circle r="7.5" fill="#ece2af" stroke="#294e43" stroke-width="1.8"/>
    </g>
  </g>

    <path d="M178 154C178 191 180 214 227 204" fill="none" stroke="#d6dfb4" stroke-width="1.75" stroke-linecap="round"/>
  </g>

  <!-- Tighter head study and a wider, turned studio portrait share the conditioning signal. -->
  <g class="id-sample-one" transform="matrix(.86 -.146 .146 .86 229 49)">
    <use href="#id-print-edge"/>
    <g transform="translate(5 5) scale(1.01)">
      <g clip-path="url(#id-picture)">
        <rect width="206" height="206" fill="#a8c4a4"/>
        <path d="M0 159Q120 130 206 36v170H0Z" fill="#6e9a85" opacity=".74"/>
        <g transform="translate(-31 -9) scale(1.27)">
          <use href="#id-subject"/>
        </g>
        <g class="id-grain"><rect width="206" height="206" filter="url(#id-noise)"/></g>
        <rect class="id-residual" width="206" height="206" fill="url(#id-cells)"/>
        <g class="id-coarse"><rect width="206" height="206" filter="url(#id-blot)"/></g>
        <rect width="206" height="206" fill="url(#id-tooth)" opacity=".25"/>
      </g>
    </g>
  </g>
  <g transform="matrix(.95 .095 -.095 .95 350 89)">
    <use href="#id-print-edge"/>
    <g transform="translate(5 5) scale(1.01)">
      <g clip-path="url(#id-picture)">
        <rect width="206" height="206" fill="#7fa8a1"/>
        <path d="M0 0h160Q109 13 67 73T0 118Z" fill="#b6cab2"/>
        <g transform="matrix(-.93 .105 .105 .93 192 13)">
          <use href="#id-subject"/>
          <use class="id-live" href="#id-jacket" clip-path="url(#id-shirt-clip)"/>
          <use class="id-still" href="#id-jacket" clip-path="url(#id-person-clip-a)"/>
        </g>
        <g class="id-grain"><rect width="206" height="206" filter="url(#id-second-grain)"/></g>
        <rect class="id-residual" width="206" height="206" fill="url(#id-cells)" transform="rotate(180 103 103)"/>
        <g class="id-coarse"><rect width="206" height="206" filter="url(#id-second-blot)"/></g>
        <rect width="206" height="206" fill="url(#id-tooth)" opacity=".25"/>
      </g>
    </g>
  </g>
<style>* { animation: none !important; transition: none !important; }</style>
</svg>
